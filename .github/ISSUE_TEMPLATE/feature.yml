name: Feature or milestone
description: Track a concrete MaskMate improvement
title: "[Feature] "
body:
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: Describe the behavior a user should see.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Include relevant privacy, pixel accuracy, and mobile checks.
    validations:
      required: true
